<main><h1>الخادم المحلي غير متاح</h1><p>استعمل زر تشغيل الخادم في التطبيق. إن لم يثبت الخادم بعد، ثبّت الحزمة الموقعة في Termux وفق دليل المشروع، ثم أعد الفحص.</p><p>افحص إذن RUN_COMMAND وإعداد allow-external-apps في Termux. لا تنفّذ هذه الصفحة أمرًا، ولا تعرض نجاح اتصال لم يثبت.</p></main>
