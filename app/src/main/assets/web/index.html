<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مساعد Antigravity</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --primary-color: #1A73E8;
            --accent-color: #00C853;
            --text-main: #FFFFFF;
            --text-dim: #B0B0B0;
            --border-color: #333333;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            line-height: 1.6;
        }

        header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 8px 0;
        }

        p {
            margin: 0 0 12px 0;
            color: var(--text-dim);
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-top: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:focus, .btn:hover {
            outline: 3px solid #8ab4f8;
            outline-offset: 2px;
        }

        .btn-accent {
            background-color: var(--accent-color);
            color: #000000;
        }

        .status-box {
            padding: 12px;
            border-radius: 6px;
            background-color: #242424;
            border: 1px solid var(--border-color);
            margin-top: 12px;
            font-weight: bold;
        }

        /* Screen reader live announcements */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>مساعد Antigravity المستقل</h1>
        <p>جسر التحكم الذكي وإمكانية الوصول بالأندرويد</p>
    </header>

    <main>
        <!-- Status Notification Box -->
        <div id="live-announcer" class="sr-only" aria-live="polite"></div>

        <section class="card" aria-labelledby="status-heading">
            <h2 id="status-heading" style="font-size: 1.2rem; margin-top: 0;">حالة الاتصال والخدمة</h2>
            <div id="status-text" class="status-box">جاري التحقق من حالة الخادم وخدمة إمكانية الوصول...</div>
            <button id="btn-refresh" class="btn" onclick="checkStatus()">تحديث الحالة</button>
        </section>

        <section class="card" aria-labelledby="actions-heading">
            <h2 id="actions-heading" style="font-size: 1.2rem; margin-top: 0;">الإجراءات السريعة</h2>
            <button class="btn" onclick="openA11ySettings()">فتح إعدادات إمكانية الوصول</button>
            <button class="btn" style="background-color: #2e7d32;" onclick="setupTermux()">نسخ كود تجهيز Termux وفتح الطرفية</button>
            <button class="btn btn-accent" onclick="wakeServer()">إيقاظ خادم تيرمكس في الخلفية</button>
            <button class="btn" onclick="goToChat()">الانتقال لواجهة الشات الرئيسية</button>
        </section>

        <section class="card" aria-labelledby="diag-heading">
            <h2 id="diag-heading" style="font-size: 1.2rem; margin-top: 0;">الفحص والتشخيص الذاتي</h2>
            <button class="btn" onclick="runDiagnostics()">تشغيل الفحص الشامل للبيئة</button>
            <div id="diag-output" style="margin-top: 12px; white-space: pre-wrap; font-family: monospace; font-size: 0.9rem; color: var(--text-dim);"></div>
        </section>
    </main>

    <script>
        function announce(text) {
            const el = document.getElementById('live-announcer');
            if (el) {
                el.textContent = text;
            }
        }

        function checkStatus() {
            announce('جاري فحص حالة الخدمات...');
            const statusBox = document.getElementById('status-text');

            let a11yActive = false;
            let bridgeAvailable = !!(window.AntigravityBridge);

            if (bridgeAvailable && typeof window.AntigravityBridge.isAccessibilityActive === 'function') {
                a11yActive = window.AntigravityBridge.isAccessibilityActive();
            }

            let ws8765Ready = false;
            let py7681Ready = false;

            if (bridgeAvailable && typeof window.AntigravityBridge.isAutomationServerReady === 'function') {
                ws8765Ready = window.AntigravityBridge.isAutomationServerReady();
            }

            if (bridgeAvailable && typeof window.AntigravityBridge.isTermuxServerReady === 'function') {
                py7681Ready = window.AntigravityBridge.isTermuxServerReady();
            }

            const a11yLabel = a11yActive ? 'مفعلة' : 'معطلة';
            const wsLabel = ws8765Ready ? 'متصل' : 'غير متصل';
            const pyLabel = py7681Ready ? 'نشط وجاهز' : 'غير نشط (يتطلب إيقاظ)';

            statusBox.innerHTML = 
                '<div>خدمة الوصول: <strong>' + a11yLabel + '</strong></div>' +
                '<div>خادم الأتمتة الداخلي (8765): <strong>' + wsLabel + '</strong></div>' +
                '<div>خادم تيرمكس للشات (7681): <strong>' + pyLabel + '</strong></div>';

            announce('حالة النظام: خدمة الوصول ' + a11yLabel + '، وخادم الأتمتة ' + wsLabel + '، وخادم تيرمكس ' + (py7681Ready ? 'جاهز' : 'غير نشط'));
        }

        function openA11ySettings() {
            if (window.AntigravityBridge && typeof window.AntigravityBridge.openSettings === 'function') {
                window.AntigravityBridge.openSettings();
                announce('تم فتح إعدادات إمكانية الوصول');
            } else {
                alert('الجسر الأصلي غير متوفر');
            }
        }

        function setupTermux() {
            if (window.AntigravityBridge && typeof window.AntigravityBridge.copySetupCommand === 'function') {
                window.AntigravityBridge.copySetupCommand();
                announce('تم نسخ كود التجهيز في الحافظة بنجاح، جاري فتح Termux...');
                setTimeout(function() {
                    if (typeof window.AntigravityBridge.openTermuxApp === 'function') {
                        window.AntigravityBridge.openTermuxApp();
                    }
                }, 400);
            } else {
                navigator.clipboard.writeText('curl -fsSL https://raw.githubusercontent.com/ahanafy41/antigravity-companion/main/setup.sh | bash');
                alert('تم نسخ كود التجهيز إلى الحافظة');
            }
        }

        function wakeServer() {
            if (window.AntigravityBridge && typeof window.AntigravityBridge.triggerServerWakeup === 'function') {
                window.AntigravityBridge.triggerServerWakeup();
                announce('تم إرسال أمر إيقاظ خادم تيرمكس في الخلفية');
                setTimeout(checkStatus, 2000);
            } else {
                announce('الجسر الأصلي غير متوفر لإيقاظ الخادم');
            }
        }

        let isNavigatingToChat = false;
        function goToChat() {
            if (isNavigatingToChat) return;

            let bridgeAvailable = !!(window.AntigravityBridge);
            let py7681Ready = false;
            if (bridgeAvailable && typeof window.AntigravityBridge.isTermuxServerReady === 'function') {
                py7681Ready = window.AntigravityBridge.isTermuxServerReady();
            }

            if (py7681Ready) {
                announce('جاري فتح واجهة الشات...');
                if (bridgeAvailable && typeof window.AntigravityBridge.loadChatUrl === 'function') {
                    window.AntigravityBridge.loadChatUrl();
                } else {
                    window.location.href = 'http://127.0.0.1:7681';
                }
                return;
            }

            // Server not ready - auto-wake and poll
            isNavigatingToChat = true;
            announce('خادم تيرمكس غير نشط حالياً. جاري إيقاظه تلقائياً في الخلفية، يرجى الانتظار ثوانٍ...');
            const statusBox = document.getElementById('status-text');
            statusBox.textContent = 'جاري إيقاظ خادم تيرمكس في الخلفية والتحضير لفتح الشات...';

            if (bridgeAvailable && typeof window.AntigravityBridge.triggerServerWakeup === 'function') {
                window.AntigravityBridge.triggerServerWakeup();
            }

            let attempts = 0;
            const maxAttempts = 12;
            const pollInterval = setInterval(function() {
                attempts++;
                let readyNow = false;
                if (window.AntigravityBridge && typeof window.AntigravityBridge.isTermuxServerReady === 'function') {
                    readyNow = window.AntigravityBridge.isTermuxServerReady();
                }

                if (readyNow) {
                    clearInterval(pollInterval);
                    isNavigatingToChat = false;
                    announce('تم تشغيل خادم تيرمكس بنجاح، جاري فتح الشات الآن...');
                    if (window.AntigravityBridge && typeof window.AntigravityBridge.loadChatUrl === 'function') {
                        window.AntigravityBridge.loadChatUrl();
                    } else {
                        window.location.href = 'http://127.0.0.1:7681';
                    }
                } else if (attempts >= maxAttempts) {
                    clearInterval(pollInterval);
                    isNavigatingToChat = false;
                    announce('استغرق تشغيل الخادم وقتاً أطول من المتوقع. يمكنك محاولة الضغط مجدداً أو تشغيله عبر تيرمكس.');
                    checkStatus();
                }
            }, 800);
        }

        function runDiagnostics() {
            const out = document.getElementById('diag-output');
            if (window.AntigravityBridge && typeof window.AntigravityBridge.runDiagnostics === 'function') {
                const jsonStr = window.AntigravityBridge.runDiagnostics();
                try {
                    const parsed = JSON.parse(jsonStr);
                    out.textContent = JSON.stringify(parsed, null, 2);
                    announce('اكتمل التشخيص. الحالة العامة: ' + parsed.status);
                } catch(e) {
                    out.textContent = jsonStr;
                }
            } else {
                out.textContent = 'أداة التشخيص المدمجة غير متوفرة حالياً خارج التطبيق.';
            }
        }

        window.addEventListener('load', function() {
            setTimeout(checkStatus, 500);
        });
    </script>
</body>
</html>
