plugins {
    id 'com.android.application'
}

def companionVersion = new groovy.json.JsonSlurper().parse(rootProject.file('server/version.json'))

android {
    namespace 'com.antigravity.companion'
    compileSdk 34

    defaultConfig {
        applicationId "com.antigravity.companion"
        minSdk 24
        targetSdk 34
        versionCode companionVersion.version_code as Integer
        versionName companionVersion.version_name

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def configuredKeystore = System.getenv("SIGNING_KEYSTORE")
            if (configuredKeystore) {
                storeFile file(configuredKeystore)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                storeType "PKCS12"
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir("generated/companionAssets").get().asFile]

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Generate the APK assets from the canonical sources; legacy copies are excluded.
def prepareCompanionWeb = tasks.register("prepareCompanionWeb", Exec) {
    workingDir rootProject.projectDir
    def pythonExecutable = System.getenv("PYTHON_EXECUTABLE") ?: "python3"
    commandLine pythonExecutable, rootProject.file("scripts/prepare_web_release.py")
}
def syncAndroidWeb = tasks.register("syncAndroidWeb", Exec) {
    dependsOn prepareCompanionWeb
    workingDir rootProject.projectDir
    def pythonExecutable = System.getenv("PYTHON_EXECUTABLE") ?: "python3"
    commandLine pythonExecutable, rootProject.file("scripts/sync_android_web.py")
}
def companionAssets = tasks.register("syncCompanionAssets", Sync) {
    dependsOn syncAndroidWeb
    into layout.buildDirectory.dir("generated/companionAssets")
    from(rootProject.file("server")) {
        into "server"
        exclude "**/__pycache__/**", "**/*.pyc", "**/*tests.cjs"
    }
    from("src/main/assets/web") {
        into "web"
        exclude "**/__pycache__/**", "**/*.pyc", "**/*tests.cjs"
    }
    from("src/main/assets/repair.html")
    from(rootProject.file("requirements.txt")) { into "server" }
    from(rootProject.file("scripts/install_release.py")) { into "server" }
}
tasks.named("preBuild").configure { dependsOn companionAssets }
tasks.matching { it.name == "validateSigningRelease" }.configureEach {
    doFirst {
        ["SIGNING_KEYSTORE", "SIGNING_STORE_PASSWORD", "SIGNING_KEY_ALIAS", "SIGNING_KEY_PASSWORD"].each { name ->
            if (!System.getenv(name)) {
                throw new GradleException("Missing private release signing configuration: " + name)
            }
        }
    }
}
