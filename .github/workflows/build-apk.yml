name: Build Antigravity Companion

on:
  push:
    branches:
      - main
      - master
      - 'preview/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build isolated debug APK
        run: gradle assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AntigravityCompanion-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Create Test Preview Release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/preview/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.6-preview-test' }}
          name: Antigravity Companion (PR-1 Debug Preview)
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore private release key
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/companion-release.p12"
      - name: Build signed release and immutable server bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/companion-release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --console=plain
          version="$(python3 -c 'import json; print(json.load(open("server/version.json"))["version_name"])')"
          python3 scripts/package_release.py --version "$version" --output .tmp/release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: AntigravityCompanion-Verified-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            .tmp/release/*/*
            scripts/install_release.py
            server/release-cert.der
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/companion-release.p12"
