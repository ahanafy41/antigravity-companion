<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#090d13">
    <title>Antigravity Companion</title>
    <link rel="stylesheet" href="/start-ui.css">
</head>
<body>

    <header role="banner">
        <h1>Antigravity Companion</h1>
    </header>

    <main role="main">
        <!-- Live region for Screen Reader announcements -->
        <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

        <section class="card" aria-labelledby="status-heading">
            <h2 id="status-heading">حالة خادم تيرمكس</h2>
            <p id="badge-server" class="status-box badge-pending" role="status" aria-live="polite" aria-atomic="true">خادم تيرمكس: جارٍ الفحص</p>
        </section>

        <section class="card" aria-labelledby="actions-heading">
            <h2 id="actions-heading">المحادثة وإدارة الخادم</h2>
            <div class="btn-group">
                <button type="button" id="btn-go-chat" class="btn btn-primary">دخول الشات والمحادثة</button>
                <button type="button" id="btn-wake-server" class="btn btn-success">تشغيل الخادم</button>
                <button type="button" id="btn-run-diag" class="btn">فحص وإصلاح الأعطال</button>
                <button type="button" id="btn-check-update" class="btn">فحص التحديثات</button>
            </div>
            <div id="diag-output" class="diag-box start-style-1" tabindex="0" role="region" aria-label="نتائج التشخيص"></div>
            <div id="update-status" class="start-style-2"></div>
        </section>

        <section class="card" aria-labelledby="setup-heading">
            <h2 id="setup-heading">الإعداد الأولي والصيانة</h2>
            <button type="button" id="btn-setup-termux" class="btn">تجهيز Termux لأول مرة</button>
        </section>
    </main>

    <footer role="contentinfo">
        <div class="footer-credit">Developed by Ahmed Hanafy</div>
        <div id="app-version-label">Antigravity Companion v1.2.7</div>
    </footer>


<script src="/api.js"></script>
<script src="/native.js"></script>
<script src="/state.js"></script>
<script src="/main-v1-adapter.js"></script>
<script src="/start-ui.js"></script>
</body>
</html>
